version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Version label + changelog “This build” row = git (tags + describe + last commit). Every GitHub push → new meta.
        - node scripts/generate-build-meta.mjs
        # Fail fast if the static export would embed an empty API URL (common cause of "Couldn't reach the server").
        - node scripts/assert-next-public-aws.mjs
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
