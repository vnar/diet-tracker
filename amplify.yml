version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Version label + “This build” row = git; recent pushes = GitHub commits API → lib/githubChangelog.generated.json
        - node scripts/generate-build-meta.mjs
        - node scripts/fetch-github-changelog.mjs
        # Fail fast if the static export would embed an empty API URL (common cause of "Couldn't reach the server").
        - node scripts/assert-next-public-aws.mjs
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
